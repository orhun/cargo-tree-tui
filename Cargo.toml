[package]
name = "cargo-tree-tui"
description = "Display an interactive tree visualization of a dependency graph"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cargo-tree-tui"
path = "src/bin/cargo/main.rs"

[dependencies]
anyhow = "1.0.104"
cargo = "=0.95.0"
cargo-util = "0.2.31"
clap = { version = "4.6.7", features = ["derive"] }
clap-cargo = "0.18.3"
crossterm = "0.29.0"
ratatui = { version = "0.30.2", features = ["layout-cache"] }
ratatui-core = { version = "0.1.2", features = ["anstyle"] }
rustc-hash = "2.1.3"

[dev-dependencies]
pretty_assertions = "1.4.1"
snapbox = { version = "1.0.0", features = ["term-svg"] }

[profile.release]
codegen-units = 1 # Allows compiler to perform better optimization.
lto = true # Enables Link-time Optimization.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
strip = true # Ensures debug symbols are removed.
